name: Keep Server Alive

on:
  schedule:
    # Morning + late-breakout: every 5 min, 07:00-11:25 IST (01:30-05:55 UTC)
    - cron: '*/5 1-5 * * 1-5'
    # Evening EOD/reports/mail: every 5 min, 15:00-17:25 IST (09:30-11:55 UTC)
    - cron: '*/5 9-11 * * 1-5'
    # Warm-start shoulders so the instance is already up before the windows
    # 05:30-07:25 IST (00:00-01:55 UTC)
    - cron: '*/10 0-1 * * 1-5'
    # 14:30-15:00 IST (09:00-09:30 UTC)
    - cron: '0,10,20,30 9 * * 1-5'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render Server
        run: |
          echo "Waking server at $(date -u) UTC / $(TZ=Asia/Kolkata date) IST"
          curl -s -m 120 "https://trading-dashboard-awoe.onrender.com/api/cron/wake?token=AI4GOhgoGEivVEpGj9yeF7Ijtx9TqlEi&source=github" || echo "Server still starting..."
          echo "Done"
      - name: Warm Python ML backend
        run: |
          curl -s -m 120 "https://trading-ml-backend-8tqj.onrender.com/health" > /dev/null || echo "Python backend still starting..."
          echo "Python backend pinged"
